LABEL rescue
TEXT HELP
Start the rescue USB with a German keyboard.
ENDTEXT
MENU LABEL Rescue USB (Deutsch)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% consoleblank=0 rescue.kbd=de %KERNEL_PARAMS%

LABEL rescue-en
TEXT HELP
Start the rescue USB with an English (US) keyboard.
ENDTEXT
MENU LABEL Rescue USB (^English keyboard)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% consoleblank=0 rescue.kbd=us vconsole.keymap=us %KERNEL_PARAMS%

LABEL rescue-ram
TEXT HELP
Copy the system to RAM first; the USB stick can then be removed.
ENDTEXT
MENU LABEL Rescue USB, copied to ^RAM
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% consoleblank=0 rescue.kbd=de copytoram=y %KERNEL_PARAMS%

LABEL rescue-text
TEXT HELP
Text mode without graphics, if the screen stays black.
ENDTEXT
MENU LABEL Rescue USB, ^text mode
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% consoleblank=0 rescue.kbd=de rescue.text=1 nomodeset %KERNEL_PARAMS%
