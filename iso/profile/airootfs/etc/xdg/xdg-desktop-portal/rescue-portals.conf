# Portals of the rescue session (XDG_CURRENT_DESKTOP=rescue, cage kiosk compositor).
# File dialogs: GNOME's portal, which uses Nautilus as the file chooser. Everything else (settings,
# "open with") from the GTK portal, which needs no GNOME Shell.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=gnome
