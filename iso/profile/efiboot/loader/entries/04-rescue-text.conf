title    Rescue USB, text mode (if the screen stays black)
sort-key 04
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% consoleblank=0 rescue.kbd=de rescue.text=1 nomodeset %KERNEL_PARAMS%
