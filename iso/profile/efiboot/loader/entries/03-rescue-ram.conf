title    Rescue USB, copied to RAM (the stick can be removed)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% consoleblank=0 rescue.kbd=de copytoram=y %KERNEL_PARAMS%
